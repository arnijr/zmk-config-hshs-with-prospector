# Enable mouse emulation (&mmv, &msc, &mkp on MSE layer)
CONFIG_ZMK_POINTING=y

# Radio TX power is configured per-target in build.yaml (+8 dBm)
# Force 1M PHY to avoid PHY update collisions during multi-peripheral BLE handshakes
CONFIG_BT_CTLR_PHY_2M=n

# Prospector display configuration (no ambient light sensor)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
