# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
---
include:
  - board: xiao_ble//zmk
    shield: sweep_dongle prospector_adapter
    cmake-args: -DCONFIG_BT_ATT_TX_COUNT=16 -DCONFIG_BT_L2CAP_TX_BUF_COUNT=16 -DCONFIG_BT_BUF_ACL_TX_COUNT=16 -DCONFIG_BT_BUF_EVT_RX_COUNT=20 -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
  - board: nrfmicro/nrf52840/zmk
    shield: sweep_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000 -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
  - board: nrfmicro/nrf52840/zmk
    shield: sweep_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000 -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
  - board: xiao_ble//zmk
    shield: settings_reset
  - board: nrfmicro/nrf52840/zmk
    shield: settings_reset
