# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# - board: nice_nano_v2
#   shield: hshs52_left nice_view_adapter nice_view
#   cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
# - board: nice_nano_v2
#   shield: hshs52_right nice_view_adapter nice_view
#   cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
# - board: seeeduino_xiao_ble
#   shield: hshs52_dongle prospector_adapter
# - board: nice_nano_v2
#   shield: hshs46_left nice_view_adapter nice_view
#   cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
# - board: nice_nano_v2
#   shield: hshs46_right nice_view_adapter nice_view
#   cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
# - board: seeeduino_xiao_ble
#   shield: hshs46_dongle prospector_adapter
# - board: nice_nano_v2
#   shield: settings_reset
# - board: seeeduino_xiao_ble
#   shield: settings_reset
---
include:
  - board: seeeduino_xiao_ble
    shield: sweep_dongle prospector_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000 -DCONFIG_BT_L2CAP_TX_BUF_COUNT=16 -DCONFIG_BT_BUF_ACL_TX_COUNT=16
  - board: nrfmicro_13
    shield: sweep_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
  - board: nrfmicro_13
    shield: sweep_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y -DCONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
  - board: seeeduino_xiao_ble
    shield: settings_reset
  - board: nrfmicro_13
    shield: settings_reset
